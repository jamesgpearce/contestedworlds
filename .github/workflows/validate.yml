name: Validate atlas
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  data:
    name: Historical data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run data:check
  site:
    name: Application and static export
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run data:build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:export
      - name: Check the GitHub project path as well as the domain root
        run: npm run build && npm run check:export
        env:
          VITE_BASE_PATH: /contestedworlds
          VITE_SITE_URL: https://jamesgpearce.github.io/contestedworlds/
          VITE_GA_ID: ''
